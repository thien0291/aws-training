<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Modern Data Platform for BFSI — Slides</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- reveal.js core + theme (CDN) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/5.1.0/reveal.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/5.1.0/theme/white.min.css" id="theme" />

  <style>
    :root {
      --aws-navy: #232F3E;
      --aws-blue: #0073BB;
      --aws-orange: #FF9900;
    }

    .reveal { font-family: "Inter", system-ui, sans-serif; }
    .reveal .slides section { text-align: left; }

    /* Student notes hidden on slide; both note streams appear in speaker view (press "S"). */
    .reveal .student-notes { display: none; }

    /* Per-slide narration audio is driven programmatically; keep the elements out of view. */
    .reveal .slide-audio { display: none; }

    /* ---- Native (HTML) slide styling, AWS-themed ---- */
    .reveal .slide-native {
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 0.4em 0.2em;
    }
    .reveal .slide-native .kicker {
      color: var(--aws-blue);
      font-weight: 700;
      font-size: 0.5em;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .reveal .slide-native h2 {
      margin: 0.15em 0 0.2em;
      font-size: 1.1em;
      line-height: 1.15;
      color: var(--aws-navy);
      text-transform: none;
    }
    .reveal .slide-native h2 em { color: var(--aws-blue); font-style: normal; }
    .reveal .slide-native .lead {
      font-size: 0.52em;
      line-height: 1.4;
      color: #3a4756;
      margin: 0 0 0.5em;
    }
    .reveal .slide-native .dim-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.3em;
      margin-bottom: 0.5em;
    }
    .reveal .slide-native .dim-grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
    .reveal .slide-native .dim-grid.cols-2 { grid-template-columns: repeat(2, 1fr); }
    .reveal .slide-native .dim {
      background: linear-gradient(135deg, #f3f8fc 0%, #eaf4fb 100%);
      border: 1px solid #d6e6f2;
      border-radius: 8px;
      padding: 0.45em 0.4em;
      display: flex;
      align-items: center;
      gap: 0.3em;
      font-size: 0.42em;
      font-weight: 600;
      color: var(--aws-navy);
    }
    .reveal .slide-native .dim i { color: var(--aws-blue); }
    .reveal .slide-native .dim strong { color: var(--aws-blue); }
    .reveal .slide-native .callout {
      display: flex;
      gap: 0.4em;
      align-items: flex-start;
      background: #fff8ec;
      border-left: 4px solid var(--aws-orange);
      border-radius: 8px;
      padding: 0.5em 0.6em;
      font-size: 0.42em;
      line-height: 1.4;
      color: #4a3d22;
    }
    .reveal .slide-native .callout i { color: var(--aws-orange); margin-top: 0.1em; }
    .reveal .slide-native ul { font-size: 0.5em; line-height: 1.5; margin: 0.2em 0 0.4em 0; }
    .reveal .slide-native ul li { margin-bottom: 0.25em; }
    /* Native-slide source/footer line hidden per request to drop slide footers. */
    .reveal .slide-native .src { display: none; }
    .reveal .slide-native .src a { color: var(--aws-blue); }

    /* Full-image slides (mode: "image") */
    .reveal .slide-image {
      width: 100%;
      max-height: 84vh;
      object-fit: contain;
      display: block;
      margin: 0 auto;
      border-radius: 8px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.12);
    }

    /* Two-column layout for concept slides */
    .reveal .slide-native .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.6em;
    }
    .reveal .slide-native .panel {
      background: #f6f8fa;
      border: 1px solid #e2e8ee;
      border-radius: 8px;
      padding: 0.5em 0.6em;
    }
    .reveal .slide-native .panel h3 {
      margin: 0 0 0.25em;
      font-size: 0.5em;
      color: var(--aws-blue);
    }
    .reveal .slide-native .panel ul { font-size: 0.44em; margin: 0; }

    /* Simple table for framework/decision slides */
    .reveal .slide-native table.mini {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.4em;
      margin-top: 0.2em;
    }
    .reveal .slide-native table.mini th,
    .reveal .slide-native table.mini td {
      border: 1px solid #dce3ea;
      padding: 0.35em 0.5em;
      text-align: left;
      vertical-align: top;
    }
    .reveal .slide-native table.mini th {
      background: #eef4fa;
      color: var(--aws-navy);
    }
    .reveal .slide-native table.mini td strong { color: var(--aws-blue); }

    /* Section header + title slides */
    .reveal .slide-native.section-header,
    .reveal .slide-native.title-slide {
      align-items: center;
      justify-content: center;
      text-align: center;
      background: linear-gradient(135deg, var(--aws-navy) 0%, var(--aws-blue) 100%);
      margin: -0.4em -0.2em;
      padding: 0.4em;
      border-radius: 10px;
    }
    .reveal .slide-native.section-header .kicker,
    .reveal .slide-native.title-slide .kicker { color: var(--aws-orange); }
    .reveal .slide-native.section-header h2,
    .reveal .slide-native.title-slide h2 { color: #fff; font-size: 1.4em; }
    .reveal .slide-native.title-slide .lead,
    .reveal .slide-native.section-header .lead { color: rgba(255,255,255,0.9); }

    /* Quiz / knowledge-check slides */
    .reveal .slide-native.quiz { justify-content: center; }
    .reveal .slide-native .question {
      font-size: 0.6em;
      line-height: 1.35;
      color: var(--aws-navy);
      font-weight: 600;
      margin-bottom: 0.6em;
    }
    .reveal .slide-native .options { display: grid; gap: 0.28em; }
    .reveal .slide-native .opt {
      display: flex;
      gap: 0.4em;
      align-items: flex-start;
      background: #f6f8fa;
      border: 1px solid #e2e8ee;
      border-radius: 8px;
      padding: 0.4em 0.55em;
      font-size: 0.42em;
      line-height: 1.35;
      color: #3a4756;
    }
    .reveal .slide-native .opt .letter { font-weight: 700; color: var(--aws-blue); flex-shrink: 0; }

    /* Top bar */
    .deck-topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 44px;
      background: linear-gradient(135deg, var(--aws-navy) 0%, var(--aws-blue) 100%);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 40;
      font-family: "Inter", system-ui, sans-serif;
      font-size: 14px;
    }
    .deck-topbar .title { font-weight: 600; }
    .deck-topbar .title span { color: var(--aws-orange); }
    .deck-topbar a {
      text-decoration: none;
      background: var(--aws-orange);
      color: var(--aws-navy);
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 6px;
    }
    .deck-topbar a.secondary,
    .deck-topbar .topbar-btn {
      background: transparent;
      color: #fff;
      border: 1px solid rgba(255,255,255,0.5);
      margin-right: 8px;
    }
    .deck-topbar .topbar-btn {
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 6px;
      cursor: pointer;
    }
    .deck-topbar .topbar-btn:hover { background: rgba(255,255,255,0.15); }
    .reveal .slides { margin-top: 20px; }

    .loading {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-family: "Inter", system-ui, sans-serif;
      color: var(--aws-navy);
    }

    /* ---- Table of contents / slide jump menu ---- */
    .toc-overlay {
      position: fixed; inset: 0;
      background: rgba(35, 47, 62, 0.55);
      z-index: 50;
      display: none;
    }
    .toc-overlay.open { display: block; }
    .toc-panel {
      position: fixed;
      top: 0; left: 0; bottom: 0;
      width: 380px; max-width: 85vw;
      background: #fff;
      box-shadow: 2px 0 24px rgba(0,0,0,0.25);
      display: flex;
      flex-direction: column;
      font-family: "Inter", system-ui, sans-serif;
      transform: translateX(-100%);
      transition: transform 0.22s ease;
    }
    .toc-overlay.open .toc-panel { transform: translateX(0); }
    .toc-panel .toc-head {
      background: linear-gradient(135deg, var(--aws-navy) 0%, var(--aws-blue) 100%);
      color: #fff;
      padding: 14px 16px;
      font-weight: 600;
      display: flex; align-items: center; justify-content: space-between;
    }
    .toc-panel .toc-close {
      background: transparent; border: none; color: #fff;
      font-size: 20px; cursor: pointer; line-height: 1; padding: 0 4px;
    }
    .toc-panel .toc-search {
      border: none; border-bottom: 1px solid #e2e8ee;
      padding: 10px 16px; font-family: inherit; font-size: 14px; outline: none;
    }
    .toc-list { overflow-y: auto; padding: 6px 0; flex: 1; }
    .toc-item {
      display: flex; gap: 10px; align-items: baseline;
      padding: 9px 16px; cursor: pointer; border: none;
      background: transparent; width: 100%; text-align: left;
      font-family: inherit; font-size: 14px; color: var(--aws-navy);
      border-left: 3px solid transparent;
    }
    .toc-item:hover { background: #f0f6fc; }
    .toc-item.active { background: #eaf4fb; border-left-color: var(--aws-orange); font-weight: 600; }
    .toc-item .toc-num {
      color: var(--aws-blue); font-weight: 700; min-width: 26px; flex-shrink: 0;
    }
    .toc-item .toc-label {
      line-height: 1.3; overflow: hidden; text-overflow: ellipsis;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    }
    .toc-item .toc-kind {
      font-size: 10px; text-transform: uppercase; letter-spacing: .04em;
      color: #8a97a6; margin-left: auto; flex-shrink: 0; align-self: center;
    }
  </style>
</head>
<body>
  <div class="deck-topbar">
    <div class="title" id="deckTitle">Modern Data Platform for BFSI</div>
    <div>
      <a class="secondary" href="index.html">All modules</a>
      <button id="tocBtn" class="topbar-btn" type="button" title="Jump to slide (T)">
        ☰ Slides
      </button>
      <button id="narrationBtn" class="topbar-btn" type="button" title="Toggle narration">
        🔇 Narration: Off
      </button>
      <button id="fullscreenBtn" class="topbar-btn" type="button" title="Toggle fullscreen (F)">
        ⛶ Fullscreen
      </button>
    </div>
  </div>

  <div class="toc-overlay" id="tocOverlay">
    <div class="toc-panel" role="dialog" aria-label="Slide list">
      <div class="toc-head">
        <span>Jump to slide</span>
        <button class="toc-close" id="tocClose" type="button" title="Close (Esc)">&times;</button>
      </div>
      <input class="toc-search" id="tocSearch" type="text" placeholder="Filter slides…" />
      <div class="toc-list" id="tocList"></div>
    </div>
  </div>

  <div class="reveal">
    <div class="slides" id="slides">
      <section><div class="loading">Loading slides…</div></section>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/5.1.0/reveal.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/5.1.0/plugin/notes/notes.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/5.1.0/plugin/markdown/markdown.min.js"></script>
  <script>
    const MODULE_TITLES = {
      "1": "Modern Data Architecture Foundations",
      "2": "The Open Data Platform — SageMaker Catalog & Lakehouse",
      "3": "Data Lake Use Cases for BFSI",
      "4": "Wrap-Up, Patterns & Next Steps",
      "5": "Redshift & RMS Deep Dive",
    };

    // Minimal markdown -> HTML for the notes body (paragraphs + links).
    function renderNotes(text) {
      if (!text) return "";
      const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      return text
        .split(/\n{2,}/)
        .map((para) => {
          let p = esc(para.trim());
          p = p.replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g,
            '<a href="$2" target="_blank" rel="noopener">$1</a>');
          p = p.replace(/\n/g, "<br>");
          return `<p>${p}</p>`;
        })
        .join("");
    }

    function getModuleNum() {
      const url = new URL(window.location.href);
      const m = url.searchParams.get("m");
      return m && /^\d+$/.test(m) ? m : "1";
    }

    // Version token appended to audio URLs so a re-narrated MP3 is never served
    // from browser/CDN cache under its old (same-named) URL. New value each load.
    const AUDIO_VERSION = Date.now();

    async function loadDeck() {
      const moduleNum = getModuleNum();
      const title = MODULE_TITLES[moduleNum] || "Slides";
      document.getElementById("deckTitle").innerHTML =
        `Module ${moduleNum} <span>· ${title}</span>`;

      const res = await fetch(`decks/m${moduleNum}.json`, { cache: "no-cache" });
      if (!res.ok) {
        document.getElementById("slides").innerHTML =
          `<section><h2>Deck not found</h2><p>Expected <code>decks/m${moduleNum}.json</code>.</p></section>`;
        initReveal();
        return;
      }
      const slides = await res.json();
      const container = document.getElementById("slides");
      container.innerHTML = slides.map((s) => {
        let body;
        if (s.mode === "native" && s.native) {
          const extra = s.nativeClass ? ` ${s.nativeClass}` : "";
          body = `<div class="slide-native${extra}">${s.native}</div>`;
        } else {
          body = s.image
            ? `<img class="slide-image" src="${s.image}" alt="Module ${moduleNum} slide ${s.n}" />`
            : "";
        }
        const student = s.student
          ? `<div class="student-notes">${renderNotes(s.student)}</div>`
          : "";
        const speaker = `<aside class="notes">${
          s.student ? `<p><strong>Slide notes</strong></p>${renderNotes(s.student)}` : ""
        }</aside>`;
        // Cache-bust audio: append a version token so browsers never replay a
        // stale MP3 cached under the same slide-N.mp3 URL after a re-narration.
        const audioSrc = s.audio ? `${s.audio}?v=${AUDIO_VERSION}` : "";
        const audio = audioSrc
          ? `<audio class="slide-audio" preload="none" src="${audioSrc}"></audio>`
          : "";
        const sectAttr = audioSrc ? ` data-audio="${audioSrc}"` : "";
        return `<section${sectAttr}>${body}${student}${speaker}${audio}</section>`;
      }).join("");

      initReveal();
      initNarration();
      buildTOC();
    }

    // ---- Table of contents / slide jump ----
    function slideLabel(section) {
      // Prefer a native <h2>, then the kicker, then the first words of the notes.
      const h2 = section.querySelector(".slide-native h2");
      if (h2 && h2.textContent.trim()) return h2.textContent.trim();
      const kicker = section.querySelector(".slide-native .kicker");
      if (kicker && kicker.textContent.trim()) return kicker.textContent.trim();
      const notes = section.querySelector(".student-notes");
      if (notes && notes.textContent.trim()) {
        const words = notes.textContent.trim().split(/\s+/).slice(0, 9).join(" ");
        return words + "…";
      }
      return "";
    }

    function slideKind(section) {
      if (section.querySelector(".slide-image")) return "image";
      if (section.querySelector(".slide-native.section-header")) return "section";
      if (section.querySelector(".slide-native.title-slide")) return "title";
      if (section.querySelector(".slide-native.quiz")) return "quiz";
      if (section.querySelector(".slide-native")) return "slide";
      return "";
    }

    function buildTOC() {
      const list = document.getElementById("tocList");
      if (!list) return;
      const sections = Array.from(document.querySelectorAll(".reveal .slides > section"));
      list.innerHTML = sections.map((sec, i) => {
        const label = slideLabel(sec) || `Slide ${i + 1}`;
        const kind = slideKind(sec);
        const kindTag = kind ? `<span class="toc-kind">${kind}</span>` : "";
        return `<button class="toc-item" data-index="${i}" type="button">` +
          `<span class="toc-num">${i + 1}</span>` +
          `<span class="toc-label">${label.replace(/</g, "&lt;")}</span>${kindTag}</button>`;
      }).join("");

      list.querySelectorAll(".toc-item").forEach((btn) => {
        btn.addEventListener("click", () => {
          Reveal.slide(parseInt(btn.dataset.index, 10));
          closeTOC();
        });
      });
      highlightTOC();
    }

    function highlightTOC() {
      const idx = Reveal.getIndices().h;
      document.querySelectorAll(".toc-item").forEach((btn) => {
        const active = parseInt(btn.dataset.index, 10) === idx;
        btn.classList.toggle("active", active);
        if (active) btn.scrollIntoView({ block: "nearest" });
      });
    }

    function openTOC() {
      document.getElementById("tocOverlay").classList.add("open");
      highlightTOC();
      const search = document.getElementById("tocSearch");
      if (search) { search.value = ""; filterTOC(""); setTimeout(() => search.focus(), 50); }
    }
    function closeTOC() {
      document.getElementById("tocOverlay").classList.remove("open");
    }
    function toggleTOC() {
      const open = document.getElementById("tocOverlay").classList.contains("open");
      if (open) closeTOC(); else openTOC();
    }
    function filterTOC(q) {
      const needle = q.trim().toLowerCase();
      document.querySelectorAll(".toc-item").forEach((btn) => {
        const text = btn.textContent.toLowerCase();
        btn.style.display = !needle || text.includes(needle) ? "" : "none";
      });
    }

    function initTOC() {
      document.getElementById("tocBtn").addEventListener("click", (e) => {
        e.currentTarget.blur();
        toggleTOC();
      });
      document.getElementById("tocClose").addEventListener("click", closeTOC);
      document.getElementById("tocOverlay").addEventListener("click", (e) => {
        if (e.target.id === "tocOverlay") closeTOC();
      });
      const search = document.getElementById("tocSearch");
      search.addEventListener("input", (e) => filterTOC(e.target.value));
      search.addEventListener("keydown", (e) => {
        if (e.key === "Escape") { closeTOC(); return; }
        if (e.key === "Enter") {
          const first = Array.from(document.querySelectorAll(".toc-item"))
            .find((b) => b.style.display !== "none");
          if (first) { Reveal.slide(parseInt(first.dataset.index, 10)); closeTOC(); }
        }
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" &&
            document.getElementById("tocOverlay").classList.contains("open")) {
          closeTOC();
        }
      });
    }

    function initReveal() {
      Reveal.initialize({
        hash: true,
        slideNumber: "c/t",
        transition: "slide",
        width: 1280,
        height: 720,
        margin: 0.04,
        navigationMode: "linear",
        plugins: [RevealNotes, RevealMarkdown],
        keyboard: {
          33: "prev", 34: "next", 32: "next",
          37: "prev", 38: "prev", 39: "next", 40: "next",
          36: () => Reveal.slide(0),
          35: () => Reveal.slide(Reveal.getTotalSlides() - 1),
          66: "togglePause", 190: "togglePause",
          84: () => toggleTOC(),   // "T" opens/closes the slide table of contents
        },
      });
      Reveal.on("slidechanged", highlightTOC);
    }

    // ---- Per-slide narration: autoplay the current slide's audio ----
    let narrationOn = false;   // user can toggle; off by default
    let audioUnlocked = false; // becomes true after the first successful play()

    function allAudioEls() {
      return Array.from(document.querySelectorAll("audio.slide-audio"));
    }

    function stopAllAudio(except) {
      allAudioEls().forEach((a) => {
        if (a !== except) {
          a.pause();
          try { a.currentTime = 0; } catch (e) {}
        }
      });
    }

    function currentAudioEl() {
      const section = Reveal.getCurrentSlide();
      return section ? section.querySelector("audio.slide-audio") : null;
    }

    function playCurrent() {
      stopAllAudio(currentAudioEl());
      if (!narrationOn) return;
      const a = currentAudioEl();
      if (!a) return;
      try { a.currentTime = 0; } catch (e) {}
      const p = a.play();
      if (p && typeof p.catch === "function") {
        p.then(() => {
          audioUnlocked = true;
          hideUnlockHint();
        }).catch(() => {
          // Autoplay blocked until a user gesture — show a one-time hint.
          if (!audioUnlocked) showUnlockHint();
        });
      }
    }

    function setNarration(on) {
      narrationOn = on;
      const btn = document.getElementById("narrationBtn");
      if (btn) btn.innerHTML = on ? "🔊 Narration: On" : "🔇 Narration: Off";
      if (on) playCurrent();
      else stopAllAudio(null);
    }

    // One-time hint shown if the browser blocks autoplay before any user gesture.
    function showUnlockHint() {
      let hint = document.getElementById("narrationHint");
      if (hint) return;
      hint = document.createElement("button");
      hint.id = "narrationHint";
      hint.type = "button";
      hint.textContent = "🔊 Click to enable narration";
      hint.style.cssText =
        "position:fixed;bottom:20px;left:50%;transform:translateX(-50%);" +
        "z-index:60;background:var(--aws-orange);color:var(--aws-navy);" +
        "border:none;border-radius:24px;padding:12px 22px;font-weight:700;" +
        "font-family:Inter,system-ui,sans-serif;font-size:15px;cursor:pointer;" +
        "box-shadow:0 4px 16px rgba(0,0,0,.25);";
      hint.addEventListener("click", () => {
        audioUnlocked = true;
        hideUnlockHint();
        playCurrent();
      });
      document.body.appendChild(hint);
    }
    function hideUnlockHint() {
      const hint = document.getElementById("narrationHint");
      if (hint) hint.remove();
    }

    function initNarration() {
      const btn = document.getElementById("narrationBtn");
      if (btn) {
        btn.addEventListener("click", (e) => {
          e.currentTarget.blur();
          setNarration(!narrationOn);
        });
      }
      Reveal.on("ready", playCurrent);
      Reveal.on("slidechanged", playCurrent);
    }

    function toggleFullscreen() {
      const el = document.documentElement;
      const isFs = document.fullscreenElement || document.webkitFullscreenElement;
      if (!isFs) {
        (el.requestFullscreen || el.webkitRequestFullscreen)?.call(el);
      } else {
        (document.exitFullscreen || document.webkitExitFullscreen)?.call(document);
      }
    }

    document.getElementById("fullscreenBtn").addEventListener("click", (e) => {
      e.currentTarget.blur();
      toggleFullscreen();
    });

    function updateFsLabel() {
      const isFs = document.fullscreenElement || document.webkitFullscreenElement;
      document.getElementById("fullscreenBtn").innerHTML =
        isFs ? "⛶ Exit fullscreen" : "⛶ Fullscreen";
    }
    document.addEventListener("fullscreenchange", updateFsLabel);
    document.addEventListener("webkitfullscreenchange", updateFsLabel);

    initTOC();
    loadDeck();
  </script>
</body>
</html>
